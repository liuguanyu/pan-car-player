plugins {
    id 'com.android.application'
}

// 正式包签名：从 Gradle 属性或本地 .signing/release.properties 读取（不入库）
def signingProps = new Properties()
def signingFile = rootProject.file('.signing/release.properties')
if (signingFile.isFile()) {
    signingFile.withInputStream { signingProps.load(it) }
}
def releaseProp = { String name -> project.findProperty(name) ?: signingProps.getProperty(name) }
def hasReleaseSigning = ['RELEASE_STORE_FILE', 'RELEASE_STORE_PASSWORD', 'RELEASE_KEY_ALIAS', 'RELEASE_KEY_PASSWORD']
        .every { releaseProp(it) }

android {
    namespace 'com.baidu.carplayer'
    compileSdk 33

    defaultConfig {
        applicationId "com.baidu.carplayer"
        minSdk 28
        targetSdk 33
        versionCode 2
        versionName "1.1"
        
        multiDexEnabled true

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseProp('RELEASE_STORE_FILE'))
                storePassword releaseProp('RELEASE_STORE_PASSWORD')
                keyAlias releaseProp('RELEASE_KEY_ALIAS')
                keyPassword releaseProp('RELEASE_KEY_PASSWORD')
                // 车机兼容：V1 + V2 双签名
                enableV1Signing true
                enableV2Signing true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    testOptions {
        unitTests.includeAndroidResources = true
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // 解决Kotlin版本冲突
    constraints {
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.10") {
            because("kotlin-stdlib-jdk7 is now part of kotlin-stdlib")
        }
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.10") {
            because("kotlin-stdlib-jdk8 is now part of kotlin-stdlib")
        }
    }

    // AndroidX核心库
    implementation 'androidx.core:core:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    
    // MultiDex支持
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.google.android.material:material:1.9.0'
    
    // Jetpack组件
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.6.1'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.6.1'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.6.1'
    implementation 'androidx.room:room-runtime:2.5.0'
    implementation 'androidx.room:room-ktx:2.5.0'
    annotationProcessor 'androidx.room:room-compiler:2.5.0'
    
    // Media3媒体播放库 - Google官方推荐，性能更优
    // 使用1.0.0版本以兼容当前的compileSdk 33
    // Media3对ALAC等音频格式有更好的支持
    implementation 'androidx.media3:media3-exoplayer:1.0.0'
    implementation 'androidx.media3:media3-ui:1.0.0'
    implementation 'androidx.media3:media3-session:1.0.0'
    
    // Media3解码器扩展 - 提供更多解码器支持
    implementation 'androidx.media3:media3-decoder:1.0.0'
    
    // MediaSession支持
    implementation 'androidx.media:media:1.6.0'
    
    // 网络请求
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.11.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.11.0'
    
    // JSON解析
    implementation 'com.google.code.gson:gson:2.10.1'
    
    // 图片加载
    implementation 'com.github.bumptech.glide:glide:4.15.1'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.15.1'
    
    // 二维码生成
    implementation 'com.google.zxing:core:3.5.1'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    
    // 测试
    testImplementation 'junit:junit:4.13.2'
    // 本地 JVM 上运行真实 Room/SQLite，用于数据一致性回归测试
    testImplementation 'org.robolectric:robolectric:4.13'
    testImplementation 'androidx.test:core:1.5.0'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
// 车机兼容：AGP 在 minSdk >= 24 时会忽略 enableV1Signing，只出 v2。
// 部分车机安装器需要 V1(JAR)+V2 双签名（与可安装的 car-radio 包一致），
// 因此 assembleRelease 后用 apksigner 重新签出 *-car.apk。
def carApkTask = tasks.register('signCarApk') {
    group = 'build'
    description = 'Re-sign release APK with V1+V2 for car head units'
    onlyIf { hasReleaseSigning }
    doLast {
        def outDir = layout.buildDirectory.dir('outputs/apk/release').get().asFile
        def src = new File(outDir, 'app-release.apk')
        def dst = new File(outDir, "app-release-car-v${android.defaultConfig.versionName}.apk")
        def sdkDir = android.sdkDirectory
        def apksigner = new File(sdkDir, "build-tools/${android.buildToolsVersion}/apksigner")
        if (!apksigner.exists()) {
            throw new GradleException("apksigner not found: ${apksigner}")
        }
        exec {
            commandLine apksigner.absolutePath, 'sign',
                    '--ks', file(releaseProp('RELEASE_STORE_FILE')).absolutePath,
                    '--ks-key-alias', releaseProp('RELEASE_KEY_ALIAS'),
                    '--ks-pass', 'env:CAR_KS_PASS', '--key-pass', 'env:CAR_KEY_PASS',
                    '--v1-signing-enabled', 'true', '--v2-signing-enabled', 'true',
                    '--v3-signing-enabled', 'false', '--min-sdk-version', '23',
                    '--out', dst.absolutePath, src.absolutePath
            environment 'CAR_KS_PASS', releaseProp('RELEASE_STORE_PASSWORD')
            environment 'CAR_KEY_PASS', releaseProp('RELEASE_KEY_PASSWORD')
        }
        exec {
            commandLine apksigner.absolutePath, 'verify', '--min-sdk-version', '23', dst.absolutePath
        }
        println "Car APK (V1+V2): ${dst}"
    }
}
afterEvaluate {
    tasks.named('assembleRelease').configure { finalizedBy carApkTask }
}
